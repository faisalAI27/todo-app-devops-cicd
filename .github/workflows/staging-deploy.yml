name: Staging ECR Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-push-deploy:
    name: Build, Push to ECR, and Deploy to Staging
    runs-on: ubuntu-latest

    env:
      IMAGE_TAG: staging
      FRONTEND_REPO: todo-frontend
      BACKEND_REPO: todo-backend
      HOST: ${{ secrets.STAGING_HOST }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      - name: Run backend tests
        working-directory: backend
        run: npm test

      - name: Run backend lint
        working-directory: backend
        run: npm run lint

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to AWS ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker images to ECR
        run: |
          FRONTEND_IMAGE=${{ secrets.ECR_REGISTRY }}/$FRONTEND_REPO:$IMAGE_TAG
          BACKEND_IMAGE=${{ secrets.ECR_REGISTRY }}/$BACKEND_REPO:$IMAGE_TAG

          docker build --build-arg VITE_API_URL=/api -t $FRONTEND_IMAGE -t ${{ secrets.ECR_REGISTRY }}/$FRONTEND_REPO:${{ github.sha }} ./frontend
          docker build -t $BACKEND_IMAGE -t ${{ secrets.ECR_REGISTRY }}/$BACKEND_REPO:${{ github.sha }} ./backend

          docker push $FRONTEND_IMAGE
          docker push $BACKEND_IMAGE
          docker push ${{ secrets.ECR_REGISTRY }}/$FRONTEND_REPO:${{ github.sha }}
          docker push ${{ secrets.ECR_REGISTRY }}/$BACKEND_REPO:${{ github.sha }}

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H $HOST >> ~/.ssh/known_hosts

      - name: Copy production compose file to Staging EC2
        run: |
          scp -i ~/.ssh/ec2_key docker-compose.prod.yml ${{ secrets.EC2_USER }}@$HOST:~/docker-compose.prod.yml

      - name: Deploy to Staging EC2
        run: |
          ssh -i ~/.ssh/ec2_key ${{ secrets.EC2_USER }}@$HOST << EOF
            set -e

            mkdir -p ~/todo-app-deploy
            mv ~/docker-compose.prod.yml ~/todo-app-deploy/docker-compose.prod.yml
            cd ~/todo-app-deploy

            printf '%s\n' \
              "FRONTEND_IMAGE=${{ secrets.ECR_REGISTRY }}/$FRONTEND_REPO:$IMAGE_TAG" \
              "BACKEND_IMAGE=${{ secrets.ECR_REGISTRY }}/$BACKEND_REPO:$IMAGE_TAG" > .env

            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}

            docker compose --env-file .env -f docker-compose.prod.yml pull
            docker compose --env-file .env -f docker-compose.prod.yml up -d
            docker compose --env-file .env -f docker-compose.prod.yml ps
          EOF

      - name: Send email notification
        if: always()
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_EMAILS: ${{ secrets.NOTIFY_EMAILS }}
          STATUS: ${{ job.status }}
        run: |
          python - <<'PYMAIL'
          import os, smtplib
          from email.message import EmailMessage

          msg = EmailMessage()
          msg["Subject"] = f"Staging Deployment {os.environ['STATUS']} - Todo App"
          msg["From"] = os.environ["SMTP_USERNAME"]
          msg["To"] = os.environ["NOTIFY_EMAILS"]
          msg.set_content(f"""
          Environment: Staging
          Status: {os.environ['STATUS']}
          Repository: {os.environ.get('GITHUB_REPOSITORY')}
          Commit: {os.environ.get('GITHUB_SHA')}
          Workflow: {os.environ.get('GITHUB_WORKFLOW')}
          """)

          with smtplib.SMTP(os.environ["SMTP_HOST"], int(os.environ["SMTP_PORT"])) as server:
              server.starttls()
              server.login(os.environ["SMTP_USERNAME"], os.environ["SMTP_PASSWORD"])
              server.send_message(msg)
          PYMAIL
