name: Deploy to Staging

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  quality-check:
    name: Build, Test and Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      - name: Run backend tests
        working-directory: backend
        run: npm test

      - name: Run backend lint
        working-directory: backend
        run: npm run lint

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

  deploy-staging:
    name: Deploy to Staging EC2
    runs-on: ubuntu-latest
    needs: quality-check

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "${{ secrets.STAGING_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy latest main code to Staging server
        run: |
          ssh -i ~/.ssh/ec2_key ${{ secrets.EC2_USER }}@${{ secrets.STAGING_HOST }} << 'EOF'
            set -e

            APP_DIR="/home/ubuntu/todo-app-devops-cicd"
            REPO_URL="https://github.com/${{ github.repository }}.git"

            if [ ! -d "$APP_DIR/.git" ]; then
              git clone "$REPO_URL" "$APP_DIR"
            fi

            cd "$APP_DIR"
            git fetch origin main
            git checkout main
            git reset --hard origin/main

            docker compose down
            docker compose up -d --build
            docker compose ps
          EOF

  email-notification:
    name: Send Email Notification
    runs-on: ubuntu-latest
    needs:
      - quality-check
      - deploy-staging
    if: always()

    steps:
      - name: Send email
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_EMAILS: ${{ secrets.NOTIFY_EMAILS }}
          QUALITY_STATUS: ${{ needs.quality-check.result }}
          DEPLOY_STATUS: ${{ needs.deploy-staging.result }}
          WORKFLOW_NAME: Deploy to Staging
          REPOSITORY: ${{ github.repository }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          python3 - << 'PY'
          import os
          import smtplib
          from email.message import EmailMessage

          required = ["SMTP_HOST", "SMTP_PORT", "SMTP_USERNAME", "SMTP_PASSWORD", "NOTIFY_EMAILS"]
          missing = [key for key in required if not os.getenv(key)]

          if missing:
              print(f"Email skipped. Missing secrets: {', '.join(missing)}")
              exit(0)

          quality = os.getenv("QUALITY_STATUS")
          deploy = os.getenv("DEPLOY_STATUS")

          overall = "SUCCESS" if quality == "success" and deploy == "success" else "FAILED"

          msg = EmailMessage()
          msg["Subject"] = f"[{overall}] {os.getenv('WORKFLOW_NAME')} - {os.getenv('REPOSITORY')}"
          msg["From"] = os.getenv("SMTP_USERNAME")
          msg["To"] = os.getenv("NOTIFY_EMAILS")

          msg.set_content(f"""
          Workflow: {os.getenv('WORKFLOW_NAME')}
          Repository: {os.getenv('REPOSITORY')}
          Branch: {os.getenv('BRANCH_NAME')}

          Quality Check Status: {quality}
          Deployment Status: {deploy}

          Overall Status: {overall}
          """)

          with smtplib.SMTP(os.getenv("SMTP_HOST"), int(os.getenv("SMTP_PORT"))) as server:
              server.starttls()
              server.login(os.getenv("SMTP_USERNAME"), os.getenv("SMTP_PASSWORD"))
              server.send_message(msg)

          print("Email notification sent.")
          PY
